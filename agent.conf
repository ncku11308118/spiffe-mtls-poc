agent {
	trust_domain = "poc.internal"
	trust_bundle_path = ""

	server_address = "spire-server"
	server_port = "8081"

	log_level = "INFO"
	log_format = "text"

	data_dir = "/opt/spire/.data"

	socket_path = "/tmp/spire-agent/public/api.sock"
}

plugins {
	NodeAttestor "join_token" {
		plugin_data {}
	}

	KeyManager "memory" {
		plugin_data {}
	}

	WorkloadAttestor "unix" {
		plugin_data {}
	}
}
