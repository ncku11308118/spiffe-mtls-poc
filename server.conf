server {
	trust_domain = "poc.internal"

	bind_address = "0.0.0.0"
	bind_port = "8081"

	log_level = "INFO"
	log_format = "text"

	data_dir = "/opt/spire/.data"

	default_x509_svid_ttl = "1h"
	default_jwt_svid_ttl = "5m"

	ca_key_type = "ec-p256"
	ca_subject {
		country = ["TW"]
		organization = ["National Cheng Kung University"]
		common_name = "SPIRE CA"
	}
	ca_ttl = "24h"
}

plugins {
	DataStore "sql" {
		plugin_data {
			database_type = "sqlite3"
			connection_string = ""
		}
	}

	NodeAttestor "join_token" {
		plugin_data {}
	}

	KeyManager "memory" {
		plugin_data {}
	}
}
